title: Kubently
description: AI SRE for Kubernetes - alerts arrive in Slack already diagnosed, with metric, log, and change evidence. Managed Cloud or self-hosted Apache-2.0.
url: "https://kubently.io"
baseurl: ""
logo: "/assets/images/kubently-logo-cropped.jpg"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: bash

# Theme removed: the site now owns its layouts/includes/styles directly
# (Terminal Noir redesign). Do not set `theme: minima` — we no longer
# depend on the minima gem's layouts or includes.

# Modern site configuration
author: Kubently Team
email: hello@kubently.io

# Social links
github_username: kubently
twitter_username: kubently

# Site colors (referenced in CSS)
brand_color: "#2563eb"
accent_color: "#0891b2"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

header_pages:
  - docs/index.md
  - contributing.md

navigation:
  - title: "Home"
    url: "/"
  - title: "Docs"
    url: "/docs/"
    children:
      - title: "Cloud Quickstart"
        url: "/docs/cloud-quickstart/"
      - title: "Self-Hosted Quickstart"
        url: "/guides/quick-start/"
      - title: "Guides"
        url: "/guides/"
      - title: "Reference"
        url: "/docs/reference/"
      - title: "Cloud"
        url: "/cloud/"
  - title: "Pricing"
    url: "https://cloud.kubently.io/pricing"
  - title: "Contributing"
    url: "/contributing/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/