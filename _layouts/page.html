---
layout: default
---

<div class="page-wrapper">
  <div class="page-inner">

    <header class="page-header">
      <h1 class="page-header__title">{{ page.title | escape }}</h1>
      {%- if page.subtitle %}
        <p class="page-header__subtitle">{{ page.subtitle | escape }}</p>
      {%- elsif page.description %}
        <p class="page-header__subtitle">{{ page.description | escape }}</p>
      {%- endif %}
    </header>

    <div class="page-content">
      {{ content }}
    </div>

  </div>
</div>
